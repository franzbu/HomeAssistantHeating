esphome:
  name: froeling
  friendly_name: "Froeling"
  
  on_boot:
    - priority: -15 
      then:
        - delay: 5s
        - component.update: lambdatronic 
        - delay: 2s
        - binary_sensor.template.publish:
            id: modbus_status
            state: !lambda 'return !std::isnan(id(boiler_temp_actual).state);'

one_wire:
  - platform: gpio
    pin: 20 
    
esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  framework:
    type: esp-idf

logger:
  level: INFO
  baud_rate: 115200

ota:
  - platform: esphome
  
web_server:
  port: 80
  version: 3

time:
  - platform: sntp
    id: sntp_time
    timezone: "CET-1CEST,M3.5.0,M10.5.0/3"

# ----------------------------------------------------------------------
# GLOBAL CONSTANTS & VARIABLES
# ----------------------------------------------------------------------
globals:
  - id: safety_countdown_start_val
    type: int
    initial_value: '1200'
  - id: min_flow_threshold
    type: float
    initial_value: '1.0'
  - id: curve_out_low
    type: float
    initial_value: '-10.0'
  - id: curve_out_high
    type: float
    initial_value: '10.0'
  - id: heating_countdown_seconds
    type: int
    initial_value: '0'
  - id: internal_schedule_target
    type: float
    initial_value: '0.0'
  - id: stubbe_heating_active
    type: bool
    initial_value: 'true'

# ----------------------------------------------------------------------
# 1. CONNECTIVITY
# ----------------------------------------------------------------------
ethernet:
  id: eth_link
  type: IP101
  phy_addr: 1
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    pin: GPIO50
    mode: CLK_EXT_IN
  power_pin: GPIO51

uart:
  - id: froeling_uart
    tx_pin: GPIO3
    rx_pin: GPIO2
    baud_rate: 57600
    stop_bits: 1
    data_bits: 8
    parity: NONE

modbus:
  - id: modbus_hub
    uart_id: froeling_uart
    send_wait_time: 250ms
    role: client

modbus_controller:
  - id: lambdatronic
    address: 2
    modbus_id: modbus_hub
    setup_priority: -10
    command_throttle: 50ms 
    update_interval: 30s

# ----------------------------------------------------------------------
# 2. WATCHDOG
# ----------------------------------------------------------------------
api:
  reboot_timeout: 0s
  on_client_disconnected:
    then:
      - logger.log: "API Disconnected! Forcing Fail-Safe."
      - lambda: |-
          if (id(boiler_being_poked).state) {
            id(heating_countdown_seconds) = id(safety_countdown_start_val);
            id(esp_status).update(); 
            ESP_LOGW("custom", "API Connection lost while heating. Entering Countdown mode.");
          }

# ----------------------------------------------------------------------
# 3. SCRIPTS
# ----------------------------------------------------------------------
script:
  - id: calculate_internal_schedule
    mode: restart
    then:
      - lambda: |-
          auto now = id(sntp_time).now();
          float calculated_target = 0.0;
          
          if (now.is_valid()) {
            int day = now.day_of_week;
            std::string sch_str = "";
            
            if      (day == 2) sch_str = id(sch_1).state;
            else if (day == 3) sch_str = id(sch_2).state;
            else if (day == 4) sch_str = id(sch_3).state;
            else if (day == 5) sch_str = id(sch_4).state;
            else if (day == 6) sch_str = id(sch_5).state;
            else if (day == 7) sch_str = id(sch_6).state;
            else if (day == 1) sch_str = id(sch_7).state;

            size_t comment_pos = sch_str.find('#');
            if (comment_pos != std::string::npos) sch_str = sch_str.substr(0, comment_pos);
            sch_str.erase(std::remove_if(sch_str.begin(), sch_str.end(), ::isspace), sch_str.end());

            bool schedule_active = false;
            float base_offset = 0.0;

            if (!sch_str.empty()) {
              int current_min = now.hour * 60 + now.minute;
              size_t pos = 0;
              while (pos < sch_str.length()) {
                size_t semi = sch_str.find(';', pos);
                std::string segment = sch_str.substr(pos, semi == std::string::npos ? std::string::npos : semi - pos);
                size_t dash = segment.find('-');
                size_t at = segment.find('@');
                
                if (dash != std::string::npos) {
                  std::string start_s = segment.substr(0, dash);
                  std::string end_s = segment.substr(dash + 1, (at == std::string::npos ? std::string::npos : at - dash - 1));
                  auto parse_time = [](std::string s) {
                    size_t c = s.find(':');
                    if (c == std::string::npos) return atoi(s.c_str()) * 60;
                    return atoi(s.substr(0, c).c_str()) * 60 + atoi(s.substr(c+1).c_str());
                  };
                  if (current_min >= parse_time(start_s) && current_min < parse_time(end_s)) {
                    schedule_active = true;
                    if (at != std::string::npos) base_offset = atof(segment.substr(at + 1).c_str());
                    break;
                  }
                }
                if (semi == std::string::npos) break;
                pos = semi + 1;
              }
            }

            if (schedule_active) {
              float stubbe_t = id(hm_stubbe_temp).state;
              float target_t = id(stubbe_target_temp).state;
              float delta_t = id(stubbe_delta).state;
              float margin_t = id(stubbe_margin).state;
              
              if (!std::isnan(stubbe_t)) {
                if (stubbe_t >= (target_t - margin_t)) {
                  id(stubbe_heating_active) = false;
                } else if (stubbe_t < (target_t - delta_t)) {
                  id(stubbe_heating_active) = true;
                }
              } else {
                id(stubbe_heating_active) = true; 
              }
              
              if (id(stubbe_heating_active)) {
                float outside;
                if (!std::isnan(id(dallas_outside_temp).state)) outside = id(dallas_outside_temp).state;
                else if (!std::isnan(id(outside_temp_sensor).state)) outside = id(outside_temp_sensor).state;
                else outside = 0.0f;
                            
                float y1 = id(curve_minus_10).state;
                float y2 = id(curve_plus_10).state;
                float x1 = id(curve_out_low);
                float x2 = id(curve_out_high);
                
                if (fabs(x2 - x1) > 0.001f) {
                  calculated_target = y1 + ((outside - x1) * (y2 - y1) / (x2 - x1)) + base_offset;
                } else {
                  calculated_target = y1 + base_offset; 
                }
              } else {
                calculated_target = 0.0; 
              }
            }
          }
          id(internal_schedule_target) = calculated_target;

  - id: write_modbus_target
    mode: restart
    parameters:
      target_val: float
    then:
      - lambda: |-
          if (target_val > id(min_flow_threshold)) {
            id(hk2_flow_setpoint_external).make_call().set_value(target_val * 2.0).perform();
            id(esp_hk2_flow_target_temp).publish_state(target_val);
          } else {
            id(esp_hk2_flow_target_temp).publish_state(id(hk2_flow_setpoint_external).state / 2.0);
          }

# ----------------------------------------------------------------------
# 4. PRIMARY CONTROLS & RECEIVERS
# ----------------------------------------------------------------------
text:
  - platform: template
    name: "Time (Manual Override)"
    id: manual_time_input
    mode: text
    optimistic: true
    restore_value: false 
    on_value:
      then:
        - lambda: |-
            if (id(sntp_time).now().is_valid()) return;
            int yr, mon, day, hr, min;
            if (sscanf(x.c_str(), "%d-%d-%d %d:%d", &yr, &mon, &day, &hr, &min) == 5) {
              struct tm t = {0};
              t.tm_year = yr - 1900; t.tm_mon = mon - 1; t.tm_mday = day;
              t.tm_hour = hr; t.tm_min = min; t.tm_isdst = -1;
              time_t epoch = mktime(&t);
              if (epoch != (time_t)-1) {
                struct timeval tv = { .tv_sec = epoch, .tv_usec = 0 };
                settimeofday(&tv, NULL);
                ESP_LOGI("custom", "Clock manually synced to: %s", x.c_str());
              }
            }

  - platform: template
    name: "1: Mo"
    id: sch_1
    mode: text
    optimistic: true
    restore_value: true
  - platform: template
    name: "2: Tu"
    id: sch_2
    mode: text
    optimistic: true
    restore_value: true
  - platform: template
    name: "3: We"
    id: sch_3
    mode: text
    optimistic: true
    restore_value: true
  - platform: template
    name: "4: Th"
    id: sch_4
    mode: text
    optimistic: true
    restore_value: true
  - platform: template
    name: "5: Fr"
    id: sch_5
    mode: text
    optimistic: true
    restore_value: true
  - platform: template
    name: "6: Sa"
    id: sch_6
    mode: text
    optimistic: true
    restore_value: true
  - platform: template
    name: "7: Su"
    id: sch_7
    mode: text
    optimistic: true
    restore_value: true

